name: CI

on:
  push:
    branches: [master, tools]
  pull_request:
    branches: [master, tools]

jobs:
  test:
    name: Lint & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JS syntax
        run: node --check calc.js

      - name: Run unit tests
        run: npm test
