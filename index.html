<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>到手薪资计算器（累计预扣法 · 逐月）</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/element-plus/dist/index.css" />
  <script src="//cdn.jsdelivr.net/npm/vue@next"></script>
  <script src="//cdn.jsdelivr.net/npm/element-plus"></script>
</head>

<body>
  <div id="app" class="demo">
    <h2>到手薪资计算器（累计预扣法 · 逐月梯度）</h2>
    <p class="hint">个税按「累计预扣法」逐月计算：累计应纳税所得额跨档后，每月税额会跳变，因此每月到手不同。</p>

    <el-row :gutter="12">
      <el-col :span="6">
        <label>月薪: </label>
        <el-input type="number" v-model="MonthlySalary"></el-input>
      </el-col>
      <el-col :span="6">
        <label>专项附加扣除(月): </label>
        <el-input type="number" v-model="SpecialDeduction"></el-input>
      </el-col>
      <el-col :span="6">
        <label>社保基数: </label>
        <el-input type="number" v-model="InsuranceBase"></el-input>
      </el-col>
      <el-col :span="6">
        <label>公积金比例(如0.08=8%): </label>
        <el-input type="number" step="0.01" v-model="HPF"></el-input>
      </el-col>
    </el-row>

    <el-row :gutter="12" style="margin-top:12px">
      <el-col :span="6">
        <label>养老保险比例: </label>
        <el-input type="number" step="0.01" v-model="PensionInsurance"></el-input>
      </el-col>
      <el-col :span="6">
        <label>医疗保险比例: </label>
        <el-input type="number" step="0.01" v-model="HealthInsurance"></el-input>
      </el-col>
      <el-col :span="6">
        <label>失业保险比例: </label>
        <el-input type="number" step="0.01" v-model="JoblessInsurance"></el-input>
      </el-col>
      <el-col :span="6" style="display:flex; align-items:flex-end; gap:8px">
        <el-button type="primary" @click="calculate">开始计算</el-button>
        <el-button @click="clear">清除</el-button>
      </el-col>
    </el-row>

    <el-table v-if="rows.length" :data="rows" stripe border style="margin-top:18px">
      <el-table-column prop="month" label="月份" width="72"></el-table-column>
      <el-table-column prop="monthTax" label="当月税" :formatter="money"></el-table-column>
      <el-table-column prop="accumulatedTax" label="累计税" :formatter="money"></el-table-column>
      <el-table-column prop="takeHome" label="当月到手" :formatter="money"></el-table-column>
      <el-table-column prop="accumulatedTakeHome" label="累计到手" :formatter="money"></el-table-column>
      <el-table-column prop="plusFund" label="加公积金(当月)" :formatter="money"></el-table-column>
      <el-table-column prop="accumulatedPlusFund" label="加公积金(累计)" :formatter="money"></el-table-column>
    </el-table>

    <el-alert v-if="rows.length" style="margin-top:14px" type="success" :closable="false"
      :title="`全年合计 ｜ 税 ¥${fmt(totals.tax)} ｜ 到手 ¥${fmt(totals.takeHome)} ｜ 加公积金 ¥${fmt(totals.plusFund)}`">
    </el-alert>
  </div>

  <script src="calc.js"></script>
  <script>
    const App = {
      data() {
        return {
          MonthlySalary: 200000,        // 月薪
          SpecialDeduction: 0,           // 专项附加扣除（按月）
          InsuranceBase: 10000,          // 社保/公积金缴费基数
          HPF: 0.08,                     // 公积金比例
          PensionInsurance: 0.08,        // 养老保险比例
          HealthInsurance: 0.02,         // 医疗保险比例
          JoblessInsurance: 0.005,       // 失业保险比例
          rows: [],
          totals: { tax: 0, takeHome: 0, plusFund: 0 }
        }
      },
      methods: {
        money(row, col, val) {
          return (val == null) ? '' : '¥' + Number(val).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        },
        fmt(n) {
          return Number(n || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        },
        clear() {
          this.rows = [];
          this.totals = { tax: 0, takeHome: 0, plusFund: 0 };
        },
        calculate() {
          const rates = {
            pension: Number(this.PensionInsurance),
            medical: Number(this.HealthInsurance),
            unemployment: Number(this.JoblessInsurance),
            housing: Number(this.HPF)
          };
          const res = window.SalaryCalc.calcYear({
            monthlySalary: Number(this.MonthlySalary),
            insuranceBase: Number(this.InsuranceBase),
            specialDeduction: Number(this.SpecialDeduction),
            threshold: 5000,
            rates: rates
          });
          this.rows = res.monthly.map(r => ({
            month: r.month,
            monthTax: r.monthTax,
            accumulatedTax: r.accumulatedTax,
            takeHome: r.takeHome,
            accumulatedTakeHome: r.accumulatedTakeHome,
            plusFund: r.plusFund,
            accumulatedPlusFund: r.accumulatedPlusFund
          }));
          this.totals = res.totals;
        }
      }
    };
    Vue.createApp(App).use(ElementPlus).mount('#app');
  </script>

  <style>
    .demo {
      font-family: sans-serif;
      max-width: 1080px;
      margin: 24px auto;
      padding: 20px 30px;
      border: 1px solid #eee;
      border-radius: 6px;
    }
    .demo h2 { margin-top: 0; }
    .hint { color: #888; font-size: 13px; margin-bottom: 16px; }
    .el-row { margin-bottom: 4px; }
    .el-col label { display: block; font-size: 13px; margin-bottom: 4px; color: #555; }
  </style>
</body>
